  <style>

/* =====================================================
   SIPKAR — MODERN SCHOOL APP UI
   ===================================================== */

:root {
  --primary: #173f5f;
  --primary-dark: #102f48;
  --accent: #f4b942;
  --success: #168a55;
  --danger: #c83c3c;
  --text: #17202a;
  --muted: #6b7280;
  --surface: #ffffff;
  --page: #f3f6fa;
  --border: #e3e8ef;
  --shadow: 0 12px 32px rgba(20, 38, 58, 0.09);
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--page);
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 10% 0%, rgba(23,63,95,0.07), transparent 28%),
    linear-gradient(180deg, #f8fafc 0%, var(--page) 100%);
}

/* =====================================================
   HEADER
   ===================================================== */

.header {
  padding: 18px 16px 20px;
  text-align: center;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.brand {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.brand-icon {
  width: 42px;
  height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 13px;
  background: #edf3f8;
  font-size: 24px;
}

.header h1 {
  margin: 0;
  font-size: 27px;
  letter-spacing: -0.5px;
}

.header p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 13px;
}

/* =====================================================
   LAYOUT
   ===================================================== */

.container {
  width: 100%;
  max-width: 540px;
  margin: 0 auto;
  padding: 18px 14px 32px;
}

.card {
  background: var(--surface);
  border: 1px solid rgba(227,232,239,0.9);
  border-radius: 22px;
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}

/* =====================================================
   LOGIN
   ===================================================== */

#halamanLogin {
  display: none;
}

.login-icon {
  width: 76px;
  height: 76px;
  margin: 2px auto 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 22px;
  background: #edf3f8;
  font-size: 43px;
}

.login-title {
  text-align: center;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.login-subtitle {
  text-align: center;
  color: var(--muted);
  margin: 7px 0 25px;
  font-size: 14px;
}

.login-field {
  margin-top: 17px;
}

.login-field label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: 700;
}

.login-field input {
  width: 100%;
  padding: 15px 16px;
  border: 1px solid #d7dee7;
  border-radius: 13px;
  font-size: 16px;
  outline: none;
  background: #fbfcfd;
  transition: 0.2s ease;
}

.login-field input:focus {
  border-color: var(--primary);
  background: white;
  box-shadow: 0 0 0 3px rgba(23,63,95,0.08);
}

.btn-login {
  width: 100%;
  margin-top: 24px;
  padding: 16px;
  border: none;
  border-radius: 14px;
  background: var(--primary);
  color: white;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 18px rgba(23,63,95,0.18);
}

.btn-login:active {
  transform: translateY(1px);
}

.btn-login:disabled {
  background: #aeb8c4;
  box-shadow: none;
}

.login-pesan {
  min-height: 20px;
  margin-top: 13px;
  text-align: center;
  color: var(--danger);
  font-size: 13px;
}

/* =====================================================
   USER / SESSION
   ===================================================== */

.user-login {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: -4px -4px 18px;
  padding: 11px 12px;
  border-radius: 13px;
  background: #f5f8fb;
  border: 1px solid var(--border);
  color: #46515e;
  font-size: 13px;
  line-height: 1.35;
}

.user-login b {
  color: var(--text);
}

.btn-logout {
  flex: 0 0 auto;
  border: 1px solid #f0c9c9;
  background: #fff6f6;
  color: var(--danger);
  border-radius: 9px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  padding: 7px 10px;
}

/* =====================================================
   SECTION TITLE
   ===================================================== */

.judul {
  text-align: center;
  margin: 4px 0 18px;
}

.judul h2 {
  margin: 0;
  font-size: 24px;
  letter-spacing: -0.4px;
}

.judul p {

/* =====================================================

}

#reader {

  border: 1px solid var(--border);

}

/* Merapikan kontrol bawaan html5-qrcode */
#reader button {
  border-radius: 10px !important;
  font-size: 14px !important;
}

#reader select {
  width: calc(100% - 16px) !important;

  border-radius: 11px !important;
  border: 1px solid #d7dee7 !important;

}

.pesan {

  align-items: center;
  justify-content: center;
  min-height: 44px;
  margin-top: 12px;

  font-size: 13px;
}

/* =====================================================

#dataSiswa {

}

.nama {
  font-size: 26px;

}

.info {

}

.poin-box {

}

.poin-label {

}

/* =====================================================

#formPoin {

}

.judul-form {

  margin-bottom: 13px;
}

.jenis-container {

}

.jenis-btn {

  padding: 14px 10px;
  font-size: 14px;

}

}

}

.jenis-btn.aktif-positif {

  box-shadow: 0 7px 15px rgba(22,138,85,0.18);
}

.jenis-btn.aktif-negatif {
  background: var(--danger);
  color: white;
  border-color: var(--danger);
  box-shadow: 0 7px 15px rgba(200,60,60,0.18);
}

.field {
  margin-top: 17px;
}

.field label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: 700;
}

select,
textarea {
  width: 100%;
  padding: 13px 14px;

  border-radius: 12px;

  background: #fbfcfd;

}

select:focus,
textarea:focus {

}

textarea {

}

.nilai-box {
  margin-top: 17px;

  border: 1px solid var(--border);

}

.nilai-label {

}

.nilai {

}

.tombol-simpan {

  padding: 16px;
  border: none;
  border-radius: 14px;

.kembali {

.kembali button {

/* =====================================================

</head>


<body>

  <div class="header">

            >

            </button>

              class="jenis-btn negatif"
              onclick="pilihJenis('Negatif')"

            </button>

  <script>
// =====================================================
  // URL WEB APP APPS SCRIPT
  // =====================================================

  const APPS_SCRIPT_URL =
    "https://script.google.com/a/macros/guru.sd.belajar.id/s/AKfycbwzXoGGI6P1aRvAVVVVfvF6lHmTPgyk8gsjMl1irmWdCqsVY7FkcIL5wBRD1xXU3lOk/exec";

  
// =====================================================
// LOGIN GURU
// =====================================================

function login() {

  const username =
    document.getElementById("usernameLogin").value.trim();

  const password =
    document.getElementById("passwordLogin").value;

  const pesanLogin =
    document.getElementById("pesanLogin");

  const btnLogin =
    document.getElementById("btnLogin");


  if (!username || !password) {

    pesanLogin.innerText =
      "Username dan password wajib diisi.";

    return;
  }


  btnLogin.disabled = true;

  btnLogin.innerText =
    "⏳ Memeriksa...";

  pesanLogin.innerText =
    "";


  const namaCallback =
    "callbackLogin_" + Date.now();


  window[namaCallback] =
    function(hasil) {

      delete window[namaCallback];


      if (!hasil.berhasil) {

        pesanLogin.innerText =
          "❌ " + hasil.pesan;

        btnLogin.disabled = false;

        btnLogin.innerText =
          "🔐 MASUK";

        return;
      }


      // Simpan identitas pengguna
      penggunaAktif = {

        idUser: hasil.idUser,

        nama: hasil.nama,

        username: hasil.username,

        role: hasil.role

      };


      localStorage.setItem(
        "sipkar_pengguna",
        JSON.stringify(penggunaAktif)
      );


      masukKeSIPKAR();

    };


  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?action=login" +
    "&username=" +
    encodeURIComponent(username) +
    "&password=" +
    encodeURIComponent(password) +
    "&callback=" +
    namaCallback;


  script.onerror =
    function() {

      delete window[namaCallback];

      pesanLogin.innerText =
        "❌ Tidak dapat menghubungi server.";

      btnLogin.disabled = false;

      btnLogin.innerText =
        "🔐 MASUK";

    };


  document.body.appendChild(script);

}
  
  // =====================================================
  // DATA SEMENTARA
  // =====================================================

  let siswaAktif = null;

  let penggunaAktif = null;
  let scannerAktif = null;

// =====================================================
// MASUK KE SIPKAR SETELAH LOGIN
// =====================================================

function masukKeSIPKAR() {

  document.getElementById("halamanLogin").style.display = "none";
  document.getElementById("bagianScanner").style.display = "block";

  dataSiswa.style.display = "none";
  formPoin.style.display = "none";

  const infoPengguna =
    document.getElementById("infoPengguna");

  infoPengguna.innerHTML =
    "👨‍🏫 Login sebagai: <b>" +
    penggunaAktif.nama +
    "</b> " +
    '<button class="btn-logout" onclick="logout()">Keluar</button>';

  pesan.innerText = "Menunggu kamera...";

  // Kamera hanya dimulai setelah login berhasil.
  mulaiScanner();
}


// =====================================================
// LOGOUT
// =====================================================

function logout() {

  if (!confirm("Apakah Anda yakin ingin keluar?")) {
    return;
  }

  if (scannerAktif) {
    try {
      scannerAktif.clear();
    } catch (error) {
      console.log(error);
    }
    scannerAktif = null;
  }

  localStorage.removeItem("sipkar_pengguna");
  penggunaAktif = null;

  location.reload();
}


// =====================================================
// CEK LOGIN SAAT HALAMAN DIBUKA
// =====================================================

function cekLogin() {

  const data =
    localStorage.getItem("sipkar_pengguna");

  if (!data) {

    document.getElementById("halamanLogin").style.display = "block";
    document.getElementById("bagianScanner").style.display = "none";
    dataSiswa.style.display = "none";
    formPoin.style.display = "none";

    return;
  }

  try {

    penggunaAktif = JSON.parse(data);

    if (
      !penggunaAktif.idUser ||
      !penggunaAktif.username
    ) {
      throw new Error("Data login tidak lengkap.");
    }

    masukKeSIPKAR();

  } catch (error) {

    console.error(error);

    localStorage.removeItem("sipkar_pengguna");
    penggunaAktif = null;

    document.getElementById("halamanLogin").style.display = "block";
    document.getElementById("bagianScanner").style.display = "none";
    dataSiswa.style.display = "none";
    formPoin.style.display = "none";
  }
}


// =====================================================
// LOGOUT MELALUI URL
// =====================================================

function prosesLogoutDariURL() {

  const parameterURL =
    new URLSearchParams(window.location.search);

  if (parameterURL.get("logout") === "1") {

    if (scannerAktif) {
      try {
        scannerAktif.clear();
      } catch (error) {
        console.log(error);
      }
      scannerAktif = null;
    }

    localStorage.removeItem("sipkar_pengguna");
    penggunaAktif = null;

    history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

    return true;
  }

  return false;
}


  // =====================================================
// MULAI SCANNER QR
// =====================================================

function mulaiScanner() {

  const reader = document.getElementById("reader");

  if (!reader) {
    console.error("Elemen reader tidak ditemukan.");
    return;
  }

  // Pastikan scanner lama tidak berjalan ganda.
  if (scannerAktif) {
    try {
      scannerAktif.clear();
    } catch (error) {
      console.log(error);
    }
    scannerAktif = null;
  }

  reader.innerHTML = "";

  scannerAktif = new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      },
      rememberLastUsedCamera: true,
      supportedScanTypes: [
        Html5QrcodeScanType.SCAN_TYPE_CAMERA
      ]
    },
    false
  );

  scannerAktif.render(
    qrBerhasil,
    function(error) {
      // Abaikan error pembacaan QR sementara
    }
  );
}

  let semuaPoin = [];

  let jenisAktif = "";


  // =====================================================
  // ELEMENT
  // =====================================================

  const pesan =
    document.getElementById("pesan");

  const bagianScanner =
    document.getElementById("bagianScanner");

  const dataSiswa =
    document.getElementById("dataSiswa");

  const formPoin =
    document.getElementById("formPoin");

  const kategori =
    document.getElementById("kategori");

  const poinSelect =
    document.getElementById("poinSelect");

  const nilai =
    document.getElementById("nilai");

  const btnSimpan =
    document.getElementById("btnSimpan");


  // =====================================================
  // QR BERHASIL DIBACA
  // =====================================================

  function qrBerhasil(qrText) {

    console.log("QR terbaca:", qrText);

    pesan.innerText =
      "QR terbaca: " + qrText;

    ambilDataSiswa(qrText);

  }


  // =====================================================
  // AMBIL DATA SISWA
  // =====================================================

  function ambilDataSiswa(qrId) {

  pesan.innerText = "Mengambil data siswa...";

  const namaCallback =
    "callbackSiswa_" + Date.now();

  window[namaCallback] = function(siswa) {

    // Hapus callback setelah selesai
    delete window[namaCallback];

    if (!siswa.ditemukan) {

      pesan.innerText =
        "❌ Siswa tidak ditemukan.";

      return;
    }

    siswaAktif = siswa;

    // Tampilkan data siswa
    document.getElementById("nama").innerText =
      siswa.nama;

    document.getElementById("idSiswa").innerText =
      "ID Siswa: " + siswa.idSiswa;

    document.getElementById("kelas").innerText =
      "Kelas: " + siswa.kelas;

    document.getElementById("poin").innerText =
      siswa.poin;

    // Sembunyikan scanner
    bagianScanner.style.display =
      "none";

    // Tampilkan data siswa
    dataSiswa.style.display =
      "block";

    // Tampilkan form poin
    formPoin.style.display =
      "block";

    // Reset form
    resetForm();

  };

  const script =
    document.createElement("script");

  script.src =
    APPS_SCRIPT_URL +
    "?qr=" +
    encodeURIComponent(qrId) +
    "&callback=" +
    namaCallback;

  script.onerror = function() {

    delete window[namaCallback];

    pesan.innerText =
      "❌ Gagal mengambil data siswa.";
  };

  document.body.appendChild(script);

}


  // =====================================================
// PILIH JENIS
// =====================================================

function pilihJenis(jenis) {

  jenisAktif = jenis;

  const btnPositif =
    document.getElementById("btnPositif");

  const btnNegatif =
    document.getElementById("btnNegatif");


  // Reset tombol
  btnPositif.classList.remove(
    "aktif-positif"
  );

  btnNegatif.classList.remove(
    "aktif-negatif"
  );


  // Aktifkan tombol yang dipilih
  if (jenis === "Positif") {

    btnPositif.classList.add(
      "aktif-positif"
    );

  } else {

    btnNegatif.classList.add(
      "aktif-negatif"
    );

  }


  // Tampilkan status memuat
  kategori.innerHTML =
    '<option value="">Memuat kategori...</option>';

  poinSelect.innerHTML =
    '<option value="">Pilih poin</option>';

  nilai.innerText =
    "-";

  btnSimpan.disabled = true;


  // =====================================================
  // CALLBACK JSONP
  // =====================================================

  const namaCallback =
    "callbackPoin_" + Date.now();


  window[namaCallback] =
    function(data) {

      // Hapus callback setelah selesai
      delete window[namaCallback];


      // Simpan semua poin
      semuaPoin = data;


      // Isi kategori
      isiKategori();

    };


  // =====================================================
  // BUAT SCRIPT JSONP
  // =====================================================

  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?action=poin&jenis=" +
    encodeURIComponent(jenis) +
    "&callback=" +
    namaCallback;


  script.onerror =
    function() {

      delete window[namaCallback];

      kategori.innerHTML =
        '<option value="">Gagal memuat kategori</option>';

      poinSelect.innerHTML =
        '<option value="">Pilih poin</option>';

      nilai.innerText =
        "-";

    };


  document.body.appendChild(script);

}


  // =====================================================
  // ISI KATEGORI
  // =====================================================

  function isiKategori() {

    kategori.innerHTML =
      '<option value="">Pilih kategori</option>';


    const daftarKategori =
      [...new Set(
        semuaPoin.map(
          item => item.kategori
        )
      )];


    daftarKategori.forEach(
      function(namaKategori) {

        const option =
          document.createElement("option");

        option.value =
          namaKategori;

        option.textContent =
          namaKategori;

        kategori.appendChild(option);

      }
    );

  }


  // =====================================================
  // KATEGORI BERUBAH
  // =====================================================

  function kategoriBerubah() {

    const kategoriDipilih =
      kategori.value;


    poinSelect.innerHTML =
      '<option value="">Pilih poin</option>';

    nilai.innerText =
      "-";


    if (!kategoriDipilih) {

      return;

    }


    const daftarPoin =
      semuaPoin.filter(
        function(item) {

          return item.kategori ===
                 kategoriDipilih;

        }
      );


    daftarPoin.forEach(
      function(item) {

        const option =
          document.createElement("option");

        option.value =
          item.idPoin;

        option.textContent =
          item.namaPoin +
          " (" +
          item.nilai +
          ")";

        option.dataset.nilai =
          item.nilai;

        poinSelect.appendChild(option);

      }
    );

  }


  // =====================================================
  // POIN BERUBAH
  // =====================================================

  function poinBerubah() {

    const pilihan =
      poinSelect.options[
        poinSelect.selectedIndex
      ];


    if (!pilihan || !poinSelect.value) {

      nilai.innerText =
        "-";

      btnSimpan.disabled =
        true;

      return;

    }


    nilai.innerText =
      pilihan.dataset.nilai;


    // Untuk tahap ini tombol tetap dinonaktifkan

    btnSimpan.disabled =
  false;

  }


  // =====================================================
  // RESET FORM
  // =====================================================

  function resetForm() {

    jenisAktif = "";

    semuaPoin = [];

    kategori.innerHTML =
      '<option value="">Pilih kategori</option>';

    poinSelect.innerHTML =
      '<option value="">Pilih poin</option>';

    nilai.innerText =
      "-";

    document.getElementById("keterangan").value =
      "";

    document.getElementById(
      "btnPositif"
    ).classList.remove(
      "aktif-positif"
    );

    document.getElementById(
      "btnNegatif"
    ).classList.remove(
      "aktif-negatif"
    );

    btnSimpan.disabled =
      true;

  }


  // =====================================================
  // KEMBALI KE SCANNER
  // =====================================================

  function kembaliScanner() {

    location.reload();

  }


  // =====================================================
  // SIMPAN
  // =====================================================

  // =====================================================
// SIMPAN POIN
// =====================================================

function simpan() {

  // Pastikan ada siswa
  if (!siswaAktif) {

    alert("Data siswa belum tersedia.");

    return;
  }


  // Ambil poin yang dipilih
  const idPoin =
    poinSelect.value;


  if (!idPoin) {

    alert("Silakan pilih poin terlebih dahulu.");

    return;
  }


  // Ambil keterangan
  const keterangan =
    document.getElementById("keterangan").value.trim();


  // Nonaktifkan tombol agar tidak double klik
  btnSimpan.disabled = true;

  btnSimpan.innerText =
    "⏳ Menyimpan...";


  // =====================================================
  // CALLBACK
  // =====================================================

  const namaCallback =
    "callbackSimpan_" + Date.now();


  window[namaCallback] =
    function(hasil) {

      // Hapus callback
      delete window[namaCallback];


      if (!hasil.berhasil) {

        alert(
          "❌ Gagal menyimpan:\n" +
          hasil.pesan
        );

        btnSimpan.disabled = false;

        btnSimpan.innerText =
          "💾 SIMPAN POIN";
        setTimeout(function() {
  location.reload();
}, 1000);

        
        return;
      }


      // =================================================
      // BERHASIL
      // =================================================

      alert(
        "✅ Poin berhasil disimpan."
      );


      // Setelah transaksi berhasil,
      // ambil kembali data siswa agar
      // poin terbaru langsung tampil.

      perbaruiDataSiswaSetelahSimpan();

    };


  // =====================================================
  // BUAT REQUEST JSONP
  // =====================================================

  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?action=simpan" +
    "&idSiswa=" +
    encodeURIComponent(
      siswaAktif.idSiswa
    ) +
    "&idPoin=" +
    encodeURIComponent(
      idPoin
    ) +
    "&idUser=" +
    encodeURIComponent(
      penggunaAktif.idUser
    ) +
    "&keterangan=" +
    encodeURIComponent(
      keterangan
    ) +
    "&callback=" +
    namaCallback;


  script.onerror =
    function() {

      delete window[namaCallback];

      alert(
        "❌ Terjadi kesalahan saat menghubungi server."
      );

      btnSimpan.disabled = false;

      btnSimpan.innerText =
        "💾 SIMPAN POIN";

    };


  document.body.appendChild(script);

}

// =====================================================
// PERBARUI DATA SISWA SETELAH SIMPAN
// =====================================================

function perbaruiDataSiswaSetelahSimpan() {

  // Setelah transaksi berhasil,
  // langsung kembali ke mode scan

  setTimeout(function() {

    siswaAktif = null;
    semuaPoin = [];
    jenisAktif = "";

    // Bersihkan data siswa
    document.getElementById("nama").innerText = "";
    document.getElementById("idSiswa").innerText = "";
    document.getElementById("kelas").innerText = "";
    document.getElementById("poin").innerText = "";

    // Sembunyikan data siswa
    dataSiswa.style.display = "none";

    // Sembunyikan form
    formPoin.style.display = "none";

    // Tampilkan scanner
    bagianScanner.style.display = "block";

    // Reset form
    resetForm();

    // Pesan
    pesan.innerText =
      "Silakan scan QR siswa berikutnya.";

    // Aktifkan tombol simpan kembali
    btnSimpan.disabled = true;
    btnSimpan.innerText =
      "💾 SIMPAN POIN";

  }, 1000);

}

if (!prosesLogoutDariURL()) {
  cekLogin();
}
